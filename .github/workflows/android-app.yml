# App Android definitiva (motore interno WebView).
# Si avvia a mano: Actions → "App Android definitiva" → Run workflow, scegliendo il tipo:
#  - prova:  APK "Risparmio Prova" da installare a mano (pacchetto diverso, convive con l'app dei tester);
#  - finale: AAB per il Play Store con il nome e il pacchetto di sempre (com.buddy4free.risparmio), da caricare in
#            Play Console come aggiornamento; il numero di versione deve essere più alto dell'ultimo caricato.
# Il file da scaricare è in fondo alla pagina dell'esecuzione, sezione Artifacts.
# La chiave di firma e le password stanno solo nei Secrets del repository.
name: App Android definitiva

on:
  workflow_dispatch:   # solo a mano, quando Lorenzo decide
    inputs:
      tipo:
        description: 'prova (APK da installare a mano) oppure finale (AAB per il Play Store)'
        type: choice
        options: [prova, finale]
        default: prova
      version_code:
        description: 'Solo per finale: numero di versione, più alto dell''ultimo caricato sul Play Store'
        required: false
        default: '16'
      version_name:
        description: 'Solo per finale: nome della versione mostrato agli utenti'
        required: false
        default: '2.3.2'

permissions:
  contents: read

concurrency:
  group: android-app
  cancel-in-progress: true

jobs:
  pacchetto:
    runs-on: ubuntu-latest
    env:
      TIPO: ${{ inputs.tipo || 'prova' }}
    steps:
      - uses: actions/checkout@v4

      - name: Pagina dell'app dentro il pacchetto
        run: |
          python3 sorgente/build_pwa.py
          W=android-app/app/src/main/assets/www
          rm -rf "$W" && mkdir -p "$W"
          cp index.html manifest.webmanifest "$W/"
          cp -r fonts vendor icons guida "$W/"
          # Android tratta in modo speciale i file .gz nel pacchetto: la lingua del lettore scontrini va già decompressa
          gunzip -c vendor/ocr/ita.traineddata.gz > "$W/vendor/ocr/ita.traineddata" && rm "$W/vendor/ocr/ita.traineddata.gz"
          echo "::notice::Pagina $(grep -o 'b4f-build" content="[0-9]*' index.html | grep -o '[0-9]*$'), $(du -sh "$W" | cut -f1)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Strumenti Android (SDK)
        working-directory: android-app
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK="$HOME/android-sdk"; fi
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SM" ]; then
            mkdir -p "$SDK/cmdline-tools" && cd "$RUNNER_TEMP"
            curl -sSfL -o clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip || { echo "::error::Download degli strumenti Android non riuscito"; exit 1; }
            unzip -q clt.zip && rm -rf "$SDK/cmdline-tools/latest" && mv cmdline-tools "$SDK/cmdline-tools/latest"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"; cd "$GITHUB_WORKSPACE/android-app"
          fi
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > "$RUNNER_TEMP/sdk.log" 2>&1 || { tail -5 "$RUNNER_TEMP/sdk.log" | while IFS= read -r l; do echo "::error::SDK: $l"; done; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties

      - name: Chiave di firma dai Secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::Manca la chiave di caricamento (ANDROID_KEYSTORE_BASE64)"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Compila
        working-directory: android-app
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IN_CODE: ${{ inputs.version_code }}
          IN_NAME: ${{ inputs.version_name }}
        run: |
          chmod +x gradlew
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/out"
          if [ "$TIPO" = finale ]; then
            case "$IN_CODE" in ''|*[!0-9]*) echo "::error::Numero di versione non valido: $IN_CODE"; exit 1;; esac
            export VERSION_CODE="$IN_CODE" VERSION_NAME="$IN_NAME"; TASK=bundleFinaleRelease
          else
            export VERSION_CODE="${{ github.run_number }}" VERSION_NAME="2.0.0-prova.${{ github.run_number }}"; TASK=assembleProvaRelease
          fi
          if ! ./gradlew --no-daemon "$TASK" 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            grep -E "What went wrong|error:|Error|FAILURE|Exception|e: " "$RUNNER_TEMP/gradle.log" | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          if [ "$TIPO" = finale ]; then
            F=app/build/outputs/bundle/finaleRelease/app-finale-release.aab
            # deve essere firmato con la chiave di caricamento registrata sulla Play Console (come l'app di oggi)
            FP=$(keytool -printcert -jarfile "$F" | grep -m1 "SHA256:" | awk '{print $2}')
            if [ "$FP" != "C4:85:82:92:ED:F0:4F:EB:3F:F1:62:5F:D1:53:B9:A8:E1:CC:E4:0A:3E:34:78:DB:42:1B:B9:96:3B:41:17:3F" ]; then
              echo "::error::Il pacchetto non è firmato con la chiave di caricamento registrata sulla Play Console"; exit 1
            fi
            cp "$F" "$RUNNER_TEMP/out/buddy4free-risparmio-v$VERSION_CODE.aab"
            echo "::notice::Pacchetto per il Play Store pronto: buddy4free-risparmio-v$VERSION_CODE.aab (versione $VERSION_NAME)"
            echo "NOME=buddy4free-risparmio-v$VERSION_CODE" >> "$GITHUB_ENV"
          else
            APK=$(ls app/build/outputs/apk/prova/release/*.apk | head -1)
            cp "$APK" "$RUNNER_TEMP/out/risparmio-prova-${{ github.run_number }}.apk"
            echo "::notice::APK pronto: risparmio-prova-${{ github.run_number }}.apk ($(du -h "$APK" | cut -f1))"
            echo "NOME=risparmio-prova-${{ github.run_number }}" >> "$GITHUB_ENV"
          fi
          rm -f "$ANDROID_KEYSTORE_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NOME }}
          path: ${{ runner.temp }}/out/*
          retention-days: 14
