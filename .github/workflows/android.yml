# Crea il pacchetto Android (.aab) firmato, da caricare sulla Play Console.
# Si avvia a mano: Actions → "App Android" → Run workflow.
# La chiave di firma e le password stanno solo nei Secrets del repository.
name: App Android

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Numero di versione: deve essere più alto di quello già caricato (es. 2, 3, 4…)'
        required: true
        default: '2'
      version_name:
        description: 'Nome della versione mostrato agli utenti'
        required: true
        default: '1.0.1'

permissions:
  contents: read

jobs:
  aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Strumenti Android (SDK)
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK="$HOME/android-sdk"; fi
          echo "::notice::SDK in $SDK"
          SM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -z "$SM" ]; then
            echo "::notice::Scarico gli strumenti Android"
            mkdir -p "$SDK/cmdline-tools" && cd "$RUNNER_TEMP"
            curl -sSfL -o clt.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip || { echo "::error::Download degli strumenti Android non riuscito"; exit 1; }
            unzip -q clt.zip && rm -rf "$SDK/cmdline-tools/latest" && mv cmdline-tools "$SDK/cmdline-tools/latest"
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          yes | "$SM" --sdk_root="$SDK" --licenses > /dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0" "platform-tools" > "$RUNNER_TEMP/sdk.log" 2>&1 || { tail -5 "$RUNNER_TEMP/sdk.log" | while IFS= read -r l; do echo "::error::SDK: $l"; done; exit 1; }
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"; echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties

      - name: Chiave di firma dai Secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::warning::Manca il secret ANDROID_KEYSTORE_BASE64: creo solo un pacchetto di prova NON firmato"; echo "SIGNED=no" >> "$GITHUB_ENV"; exit 0; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.keystore"
          echo "SIGNED=yes" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"

      - name: Compila il pacchetto
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          chmod +x gradlew
          set -o pipefail
          if ! ./gradlew --no-daemon bundleRelease 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            grep -E "What went wrong|error:|Error|FAILURE|Exception|e: " "$RUNNER_TEMP/gradle.log" | head -15 | while IFS= read -r l; do echo "::error::$l"; done
            tail -25 "$RUNNER_TEMP/gradle.log" | tr '\n' '|' | sed 's/^/::error::FINE: /'; echo
            exit 1
          fi

      - name: Controlla che sia firmato con la chiave di caricamento giusta
        if: env.SIGNED == 'yes'
        run: |
          FP=$(keytool -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -m1 "SHA256:" | awk '{print $2}')
          echo "Impronta: $FP"
          if [ "$FP" != "C4:85:82:92:ED:F0:4F:EB:3F:F1:62:5F:D1:53:B9:A8:E1:CC:E4:0A:3E:34:78:DB:42:1B:B9:96:3B:41:17:3F" ]; then
            echo "::error::Il pacchetto non è firmato con la chiave di caricamento registrata sulla Play Console"; exit 1
          fi
          rm -f "$ANDROID_KEYSTORE_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: buddy4free-risparmio-v${{ inputs.version_code }}${{ env.SIGNED == 'yes' && '-firmato' || '-PROVA-non-firmato' }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
