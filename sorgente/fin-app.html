<title>Buddy4Free Risparmio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Permanent+Marker&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first column with a fixed bottom tab bar (Home, Movimenti, Pilastri, Palestra). Single dark look on purpose: the Buddy4Free logo is yellow on black */
:root{
  --bg:#000000; --soft:#141414; --soft2:#1F1F1F; --fg:#FFFFFF; --muted:#A3A39E; --line:#2A2A2A;
  --yellow:#FFC90A; --red:#FF453A;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#e5484d;
  --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --marker:"Permanent Marker", "Marker Felt", "Comic Sans MS", cursive;
  color-scheme:dark;
}
/* l'app è già scura: i browser con tema scuro forzato (es. Samsung Internet) la lasciano com'è */
@media (prefers-color-scheme: dark){:root{color-scheme:dark}}
@media (prefers-color-scheme: light){:root{color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
button,a,.item,.chip,.stop,label{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.app{max-width:560px;margin:0 auto;padding-block:14px calc(96px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:24px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:clamp(1.9rem,7.5vw,2.5rem);font-weight:900;letter-spacing:-.025em}
h2{font-size:clamp(1.6rem,6vw,2rem);font-weight:900;letter-spacing:-.02em}
h3{font-size:1.15rem;font-weight:800}
.hl{color:var(--red);background:linear-gradient(var(--red),var(--red)) 0 100%/100% 3px no-repeat;padding-bottom:2px}
.y{color:var(--yellow)}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.num{font-variant-numeric:tabular-nums}
.label{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.marker{font-family:var(--marker);letter-spacing:.02em}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--yellow)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 13px;min-width:0;width:100%}
textarea{resize:vertical;min-height:80px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:8px;border:0;background:none;padding:0}
.logo img{height:40px;width:auto;display:block}
.back{border:0;background:none;padding:6px 0;font-weight:700;display:inline-flex;align-items:center;gap:6px;color:var(--muted);align-self:flex-start}
.sec{display:flex;flex-direction:column;gap:12px}
.intro{display:flex;flex-direction:column;gap:8px}
.btn{border:0;border-radius:12px;padding:13px 20px;font-weight:700;background:var(--yellow);color:#000;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:8px 13px;font-size:.88rem;border-radius:10px}
.btn.wide{width:100%}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--soft2);color:var(--muted)}
.textlink{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.85rem;align-self:flex-start}
.card{background:var(--soft);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.note{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:.92rem}
.demo{background:var(--yellow);color:#000;border-radius:12px;padding:10px 14px;font-size:.88rem;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.demo button{border:0;background:#000;color:#fff;border-radius:8px;padding:6px 10px;font-weight:700;font-size:.82rem}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(0,0,0,.94);border-top:1px solid var(--line);padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));display:flex;justify-content:center}
.tabs div{display:grid;grid-template-columns:repeat(6,1fr);max-width:560px;width:100%}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.62rem;font-weight:700;color:var(--muted);min-width:0;letter-spacing:-.01em}
.tabs button[aria-current="true"]{color:var(--yellow)}
.fab{position:fixed;right:max(18px, calc(env(safe-area-inset-right, 0px) + 18px));bottom:calc(84px + env(safe-area-inset-bottom, 0px));z-index:16;width:58px;height:58px;border-radius:50%;border:0;background:var(--yellow);color:#000;display:grid;place-items:center;box-shadow:0 6px 24px rgba(255,201,10,.35)}
.fab svg.i{width:28px;height:28px;stroke-width:2.6}
@media (min-width:640px){.fab{right:calc(50% - 280px)}}

/* month nav */
.month{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month b{font-family:var(--display);font-size:1.05rem;text-transform:capitalize}
.month button{border:1px solid var(--line);background:none;border-radius:10px;width:38px;height:38px;display:grid;place-items:center}

/* savings hero */
.hero{border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--soft);border:1px solid var(--line)}
.rate{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.rate .big{font-family:var(--display);font-weight:900;font-size:clamp(2.6rem,12vw,3.4rem);line-height:1;letter-spacing:-.03em}
.status{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 11px;font-weight:800;font-size:.8rem;color:#000}
.status[style*="--soft2"]{color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}.status[style*="--soft2"] *{color:inherit;border-color:currentColor}.status[style*="--soft2"]::before{background:var(--muted);opacity:1}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:#000;opacity:.7}
.scale{position:relative;height:10px;border-radius:99px;display:grid;grid-template-columns:10fr 15fr 15fr 60fr;gap:2px;overflow:visible}
.scale span{border-radius:3px}
.scale span:first-child{border-radius:99px 3px 3px 99px}
.scale span:last-child{border-radius:3px 99px 99px 3px}
.scale i{position:absolute;top:-5px;width:4px;height:20px;border-radius:3px;background:var(--fg);box-shadow:0 0 0 2px var(--bg);transform:translateX(-2px)}
.scale-lbl{position:relative;height:1.1em;font-size:.7rem;color:var(--muted)}
.scale-lbl span{position:absolute;transform:translateX(-50%)}
.scale-lbl span:first-child{transform:none}
.scale-lbl span:last-child{transform:translateX(-100%)}
.io{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.io div{background:var(--bg);border-radius:12px;padding:10px 12px;border:1px solid var(--line)}
.io b{display:block;font-family:var(--display);font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums}

/* bars */
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;border:0;background:none;padding:0;text-align:left;width:100%}
.hbar .ic{width:30px;height:30px;border-radius:9px;background:var(--soft2);display:grid;place-items:center}
.hbar .ic svg.i{width:17px;height:17px}
.hbar .t{display:flex;flex-direction:column;gap:5px;min-width:0}
.hbar .t span{font-size:.88rem;font-weight:600}
.hbar .track{height:8px;border-radius:99px;background:var(--soft2)}
.hbar .track i{display:block;height:100%;border-radius:4px 99px 99px 4px;background:var(--yellow);min-width:4px}
.hbar .v{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;text-align:right}
.hbar .v small{display:block;color:var(--muted);font-weight:500}
.trend{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:130px}
.trend div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;position:relative}
.trend span.b{width:100%;max-width:34px;border-radius:4px 4px 2px 2px;min-height:3px}
.trend small{font-size:.7rem;color:var(--muted);text-transform:capitalize}
.trend em{font-style:normal;font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums}

/* goal */
.goal{background:var(--yellow);color:#000;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.goal .label{color:#000;opacity:.65}
.goal .gbar{height:12px;border-radius:99px;background:rgba(0,0,0,.18);overflow:hidden}
.goal .gbar i{display:block;height:100%;background:#000;border-radius:99px}
.goal .btn{background:#000;color:#fff;align-self:flex-start}
.goal .muted{color:rgba(0,0,0,.65)}
.pill-ok{display:inline-flex;align-self:flex-start;border-radius:99px;padding:3px 10px;font-weight:800;font-size:.78rem;background:#000;color:var(--yellow)}

/* lists */
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item .t{display:flex;flex-direction:column;gap:1px;min-width:0}
.item .t b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .sub{font-size:.82rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .amt{font-variant-numeric:tabular-nums;font-weight:800;text-align:right;white-space:nowrap}
.item .amt.in{color:var(--good)}
.ic{width:38px;height:38px;border-radius:12px;background:var(--soft2);display:grid;place-items:center;flex:0 0 auto}
.ic.y{background:var(--yellow);color:#000}
.dayhead{font-size:.78rem;font-weight:700;color:var(--muted);padding:14px 2px 4px;text-transform:capitalize}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:7px 13px;font-weight:600;font-size:.85rem}
.recsum{display:flex;flex-direction:column;gap:10px}.recsum .grid2 div{display:flex;flex-direction:column;gap:2px}.recsum b{font-size:1.25rem}
.recoff{opacity:.6}.recend summary{cursor:pointer;margin-bottom:8px}
.filters button[aria-pressed="true"]{background:var(--yellow);color:#000;border-color:var(--yellow)}

/* add form */
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);border-radius:14px;padding:5px}
.seg2 button{border:0;background:none;border-radius:10px;padding:10px;font-weight:800}
.seg2 button[aria-pressed="true"]{background:var(--yellow);color:#000}
.amount{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--yellow);padding-bottom:6px}
.amount span{font-family:var(--display);font-size:2rem;font-weight:800;color:var(--muted)}
.amount input{border:0;background:none;font-family:var(--display);font-size:2.6rem;font-weight:900;padding:0;border-radius:0}
.catview{display:flex;border:1px solid var(--line);border-radius:99px;padding:2px;flex:none}.catview button{border:0;background:none;color:var(--muted);font-size:.75rem;font-weight:700;padding:5px 10px;border-radius:99px}.catview button[aria-pressed="true"]{background:var(--yellow);color:#000}
.catlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.cl+.cl{border-top:1px solid var(--line)}.clrow{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;background:none;border:0;color:inherit;text-align:left}
.clrow .t{flex:1;display:flex;flex-direction:column;min-width:0}.clrow .t b{font-size:1rem}.clrow .sub{font-size:.78rem;color:var(--muted)}.clrow[aria-current="true"] .t b{color:var(--yellow)}
.clchev{font-size:1.3rem;color:var(--muted);width:22px;text-align:center}.clchev .i{width:18px;height:18px}.cl.open{background:var(--soft)}
.clsubs{display:flex;flex-wrap:wrap;gap:8px;padding:2px 14px 14px 62px}.clsubs button{border:1px solid var(--line);background:#000;border-radius:99px;padding:9px 14px;font-weight:600;font-size:.88rem;color:inherit}.clsubs button[aria-pressed="true"]{background:var(--yellow);color:#000;border-color:var(--yellow)}.clsubs .muted{color:var(--muted)}
.clnew{padding:0 14px 14px 62px}
.list .item.off{opacity:.55}
.ocrcat{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:14px;padding:12px}.ocrtxt{white-space:pre-wrap;font-size:.72rem;max-height:160px;overflow:auto;margin:6px 0 0}
.qmini{display:flex!important;flex-direction:row!important;justify-content:flex-start!important;align-items:center;gap:12px;width:100%;text-align:left;color:inherit;padding:12px 14px}.qmini .t{flex:1;display:flex;flex-direction:column;min-width:0}.qmini .sub{font-size:.8rem;color:var(--muted)}.qmini .qmore{font-size:.8rem;font-weight:700;color:var(--yellow)}
.amount{position:relative;cursor:pointer}.amount input{cursor:pointer;caret-color:transparent}.amtx{position:absolute;right:0;bottom:-22px;font-style:normal;font-size:.85rem;font-weight:700;color:var(--yellow)}
.kpad{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));background:#0b0b0b;border-top:1px solid var(--line);max-width:560px;margin:0 auto}
.kpad button{height:58px;border:0;border-radius:16px;background:var(--soft);color:var(--fg);font-family:var(--display);font-size:1.55rem;font-weight:800;display:grid;place-items:center;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.kpad button:active{transform:scale(.96);background:var(--soft2)}.kpad .kop{color:var(--yellow)}.kpad .kok{background:var(--yellow);color:#000}.kpad .kok .i{width:30px;height:30px;stroke-width:3}
.kpsheet{position:fixed;inset:0;z-index:80}.kpsbg{position:absolute;inset:0;background:rgba(0,0,0,.55)}.kpsbox{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#0b0b0b;border-top:2px solid var(--yellow);border-radius:20px 20px 0 0}
.kpshead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 16px 4px}.kpshead b{font-family:var(--display);font-size:2rem;margin-left:auto}.kpsheet .kpad{position:static;border-top:0;background:none}
.kpbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px calc(12px + env(safe-area-inset-bottom,0px));background:#0b0b0b;border-top:1px solid var(--line);max-width:560px;margin:0 auto}.kpbar .btn{height:58px;border-radius:16px;justify-content:center;font-size:1.05rem}
body.kpsave #tabs{display:none!important}body.kpsave .app{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
body.kpon #tabs,body.kpon .savebig,body.kpon #delwrap{display:none!important}body.kpon .app{padding-bottom:calc(300px + env(safe-area-inset-bottom,0px))}
.qday{display:flex;flex-direction:column;gap:12px;border-color:var(--yellow)}.qday .qq{font-size:1.08rem;line-height:1.35}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.cats button{border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.74rem;font-weight:600;line-height:1.15;text-align:center;min-height:78px}
.cats button[aria-pressed="true"]{background:var(--yellow);color:#000;border-color:var(--yellow)}
.subs{display:flex;gap:6px;flex-wrap:wrap}
.subs button{border:1px solid var(--line);background:var(--soft);border-radius:99px;padding:7px 12px;font-weight:600;font-size:.85rem}
.subs button[aria-pressed="true"]{background:var(--fg);color:#000;border-color:var(--fg)}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--yellow)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.colpick{display:flex;flex-wrap:wrap;gap:8px}
.colpick button{width:36px;height:36px;border-radius:50%;border:2px solid transparent}
.colpick button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--bg) inset}
.colpick .cg{width:auto;border-radius:99px;padding:0 12px;background:var(--soft);border:1px solid var(--line);font-weight:600;font-size:.85rem;display:inline-flex;align-items:center;gap:6px}
.colpick .cg .i{width:16px;height:16px}
.cman2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.txlinks{display:grid;grid-template-columns:1fr 1fr;gap:10px}.txlinks button{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--soft);border-radius:14px;padding:11px 12px;color:inherit}.txlinks .i{width:22px;height:22px;color:var(--yellow);flex:none}.txlinks .t{display:flex;flex-direction:column;min-width:0}.txlinks b{font-size:.95rem}.txlinks .t span{font-size:.78rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.choose .cmanage{border-style:dashed;grid-template-columns:auto 1fr;padding:12px;gap:10px}
.choose .cmanage .ic{width:36px;height:36px;border-radius:11px}
.choose .cmanage .t b{font-size:1.02rem;line-height:1.15}
.item.selrow{grid-template-columns:auto 1fr auto;cursor:pointer}
.item.subrow{grid-template-columns:auto 1fr auto}
.item.selrow input,.item.subrow input{width:22px;height:22px;margin:0;accent-color:var(--yellow)}
.item.selrow.off{opacity:.45;cursor:default}
.list .item.selrow{display:grid;width:100%;box-sizing:border-box}
.item.selrow .amt{justify-self:end}
.seg3.views button[aria-pressed="true"]{background:var(--yellow);color:#000}
.io3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.io3 > div{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.io3 b{font-size:1rem;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ancrumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:700}
.ancrumbs button{border:0;background:none;color:var(--muted);padding:4px 0;font-weight:700;text-decoration:underline}
.ancrumbs button[aria-current="true"]{color:var(--fg);text-decoration:none}
.ancrumbs span{color:var(--muted)}
.hbar .t .small{font-size:.72rem}
.rfbox{border:1px dashed #22A45D;border-radius:14px;padding:12px;align-items:flex-start;gap:10px}
.rfbox input{margin-top:2px;width:22px;height:22px;flex:0 0 22px;accent-color:#22A45D}
.txq{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:0 12px}
.txq .i{width:18px;height:18px;color:var(--muted);flex:0 0 18px}
.txq input{border:0;background:none;flex:1;min-width:0;padding:12px 0}
.txq button{border:0;background:none;color:var(--muted);font-size:1.4rem;line-height:1;padding:4px}
.txfilt{display:flex;flex-direction:column;gap:8px}
.txfilt select{width:100%}
.cxwrap{border-bottom:1px solid var(--line)}
.cxwrap .item.cxrow{grid-template-columns:1fr auto;border-bottom:0;padding:6px 2px}
.cxhead{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:none;border:0;color:inherit;text-align:left;padding:6px 0;min-width:0}
.cxhead .chev .i{transition:transform .2s}
.cxwrap.open .cxhead .chev .i{transform:rotate(90deg)}
.subbox{margin:0 0 10px 18px;padding-left:14px;border-left:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.subbox .item{padding:8px 2px}
.cxtools{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between}
.cxtools .btn .i{width:16px;height:16px}
.cxwrap .item.cxrow.sel{grid-template-columns:auto 1fr}
.cxwrap .item.cxrow.sel input,.subbox .subrow input{width:22px;height:22px;margin:0;accent-color:var(--yellow)}
.cxedit{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--fg);display:grid;place-items:center}

const GYM = [
  {t:'Tutto parte dal tracciamento', acts:['Registra tutte le entrate di questo mese: stipendio, extra, regali, vendite.','Inserisci come ricorrenti le spese fisse: affitto o mutuo, bollette, abbonamenti.','Registra ogni spesa subito, appena paghi: apri l\'app e la segni. Bastano 5 secondi.'],
    i:'Non puoi migliorare quello che non misuri. Chi annota entrate e uscite per qualche settimana scopre quasi sempre spese che non immaginava. Il tracciamento non serve a sentirsi in colpa: serve a vedere.',
    deep:['La maggior parte delle persone sa con precisione quanto guadagna, ma stima le proprie spese al ribasso. Le uscite grandi si ricordano, quelle piccole e frequenti no: il caffè, la spesa "veloce", l\'acquisto online della sera. Sono proprio queste a fare la differenza a fine mese.','Il primo mese di tracciamento è una fotografia, non un esame. Non cambiare ancora le tue abitudini: registra tutto con onestà. Dal secondo mese potrai confrontare, capire e decidere dove intervenire.'],
    tips:[['Inizia','Registra subito: paghi, apri l\'app e segni. In 5 secondi hai fatto, e non devi ricordare niente a fine giornata. Rimandare a "stasera" funziona per qualche giorno, poi si salta: farlo subito diventa un\'abitudine.'],['Inizia','Usa le spese ricorrenti: le inserisci una volta e tornano ogni mese da sole.'],['Sostituisci','Se paghi in contanti, segna la spesa appena esci dal negozio: è il momento in cui te la ricordi meglio.'],['Inizia','Non cercare la perfezione: un tracciamento al 90% vale molto più di nessun tracciamento.']],
    pill:'Una spesa da 3 € al giorno vale circa 1.095 € in un anno. Le piccole cifre ripetute sono le più costose.'},
  {t:'Le 5 strade del risparmio', acts:['Registra le spese di ieri e di oggi, anche il caffè.','Scegli una spesa del mese e chiediti quale delle 5 strade potresti usare.','Scrivi nella nota della tappa la tua spesa più "automatica".'],
    i:'Risparmiare non vuol dire solo tagliare. Per ogni spesa ci sono cinque domande da farsi, e "eliminare" è solo la prima.',
    deep:['Molti abbandonano il risparmio perché lo vivono come una rinuncia continua. Ma tagliare è solo una delle strade, e spesso non la più efficace. Rinegoziare un contratto o cambiare fornitore può far risparmiare centinaia di euro all\'anno senza cambiare nulla del tuo stile di vita.','Le cinque strade funzionano anche insieme. Prendi l\'abbonamento in palestra: puoi eliminarlo se non lo usi, rinegoziarlo con un piano annuale, sostituirlo con una palestra più economica, averlo gratis con l\'attività all\'aperto, o pagarlo con un\'entrata extra.'],
    tips:[['Elimina','Mi serve davvero? Se non la usi o non ti dà valore, toglila.'],['Rinegozia','Posso pagarla meno restando con lo stesso fornitore? Spesso basta chiedere.'],['Sostituisci','Esiste qualcosa di uguale che costa meno? Marche del distributore, ricondizionato, usato.'],['Gratis','Posso averla gratis? Biblioteche, prestiti, scambi, servizi pubblici. E poi la quinta strada: guadagna di più.']],
    pill:'Il risparmio più facile è quello che non ti chiede di rinunciare a niente: pagare meno la stessa cosa.'},
  {t:'Abbonamenti: il costo invisibile', acts:['Controlla l\'estratto conto degli ultimi 3 mesi e annota ogni addebito ricorrente.','Inserisci nell\'app tutti gli abbonamenti come uscite ricorrenti.','Disdici almeno un abbonamento che non hai usato nell\'ultimo mese.'],
    i:'Un abbonamento da 9,99 € al mese costa 119,88 € all\'anno. Cinque piccoli abbonamenti dimenticati possono valere un weekend di vacanza.',
    deep:['Gli abbonamenti sono progettati per essere dimenticati: l\'addebito è automatico, piccolo e arriva sempre nello stesso giorno. Il costo mensile sembra trascurabile, ma il costo annuale racconta un\'altra storia. Ragiona sempre in euro all\'anno.','Non serve rinunciare a tutto. Il punto è pagare solo quello che usi davvero, quando lo usi. Uno streaming per volta, cambiato ogni mese o due, ti dà accesso agli stessi contenuti a una frazione del costo.'],
    tips:[['Elimina','Disdici quelli non usati nell\'ultimo mese. Se ti mancano, li riattivi in due minuti.'],['Sostituisci','Fai ruotare le piattaforme di streaming: una alla volta.'],['Rinegozia','Valuta piani famiglia o condivisi e piani annuali per i servizi che usi davvero.'],['Gratis','Prima di pagare un\'app controlla se la versione gratuita ti basta.']],
    pill:'Segna in calendario la data di fine di ogni prova gratuita: è lì che inizia l\'addebito.'},
  {t:'Luce e gas: confrontare senza fatica', acts:['Prendi l\'ultima bolletta di luce e trova i consumi annui e il prezzo dell\'energia.','Confronta le offerte sul Portale Offerte di ARERA (ilportaleofferte.it).','Fai lo stesso con la bolletta del gas.'],
    i:'Cambiare fornitore di luce e gas è gratuito e non interrompe la fornitura. Eppure molte famiglie restano anni sulla stessa offerta senza confrontarla.',
    deep:['In bolletta trovi due cose fondamentali: il consumo annuo (in kWh per la luce, in Smc per il gas) e il prezzo della materia prima. Con questi due numeri puoi confrontare qualsiasi offerta. Il Portale Offerte è il sito pubblico gestito dall\'Autorità per l\'energia: è gratuito e non vende nulla.','Quando confronti, guarda la spesa annua stimata, non solo il prezzo al kWh: contano anche i costi fissi mensili. E controlla se il prezzo è fisso o variabile: il fisso dà certezza, il variabile segue il mercato.'],
    tips:[['Sostituisci','Inserisci i tuoi consumi reali sul Portale Offerte e ordina per spesa annua.'],['Rinegozia','Chiama il tuo fornitore con l\'offerta migliore trovata: a volte adegua il prezzo.'],['Elimina','Spegni gli apparecchi in stand-by con una ciabatta con interruttore.'],['Sostituisci','Con una tariffa a fasce, sposta lavatrice e lavastoviglie nelle ore più economiche.']],
    pill:'Per cambiare fornitore basta il codice POD (luce) o PDR (gas), che trovi in bolletta.'},
  {t:'Rinegoziare: come chiamare l\'operatore', acts:['Annota quanto paghi oggi per telefono e internet.','Trova l\'offerta concorrente più bassa per un servizio equivalente.','Chiama il tuo operatore e chiedi di adeguare il prezzo.'],
    i:'Le offerte migliori spesso sono riservate ai nuovi clienti. Chi chiede, però, a volte ottiene lo stesso trattamento. Rinegoziare è una competenza, e si allena.',
    deep:['Le aziende sanno che trovare un nuovo cliente costa più che tenerne uno. Per questo esistono uffici dedicati a trattenere chi vuole andare via. Una telefonata educata, con un\'alternativa concreta in mano, è spesso sufficiente per ottenere uno sconto.','Prepara la chiamata: cifra attuale, offerta concorrente, frase chiara. Se la prima risposta è no, chiedi gentilmente se esistono offerte di fidelizzazione. Se non ottieni nulla, cambiare operatore mantenendo il numero è un tuo diritto.'],
    tips:[['Rinegozia','Prima di chiamare scrivi: quanto paghi, l\'offerta migliore trovata, cosa vuoi ottenere.'],['Rinegozia','"Sono cliente da X anni, ho trovato un\'offerta a Y euro. Potete propormi qualcosa di simile?"'],['Sostituisci','La portabilità del numero è gratuita: non temere di perderlo.'],['Elimina','Controlla in fattura i servizi aggiuntivi a pagamento che non usi.']],
    pill:'La stessa tecnica funziona con pay TV, assicurazioni e, a volte, con la banca.'},
  {t:'La spesa intelligente', acts:['Prepara il menù della settimana partendo da quello che hai già in casa.','Scrivi la lista della spesa dal menù e compra solo quello che c\'è.','Confronta il prezzo al chilo di 3 prodotti che compri sempre.'],
    i:'Gli alimentari sono una delle voci più grandi del bilancio familiare e una di quelle dove si spreca di più, spesso buttando cibo comprato in eccesso.',
    deep:['Ogni prodotto buttato è denaro buttato due volte: lo hai pagato e non lo hai usato. Pianificare i pasti riduce gli sprechi e gli acquisti d\'impulso, che al supermercato sono incoraggiati da tutto: posizione dei prodotti, offerte "prendi 3 paghi 2", musica, percorsi.','Il prezzo al chilo o al litro, scritto in piccolo sul cartellino, è l\'unico modo per confrontare davvero. Le confezioni grandi non sono sempre le più convenienti, e le marche del distributore spesso sono prodotte da aziende note.'],
    tips:[['Elimina','Fai la lista dal menù e da cosa hai in frigo. Compra solo quello che c\'è in lista.'],['Sostituisci','Confronta il prezzo al chilo, non quello della confezione.'],['Sostituisci','Non fare la spesa a stomaco vuoto: si compra di più d\'impulso.'],['Gratis','App come Too Good To Go permettono di comprare a poco il cibo invenduto dei negozi vicini.']],
    pill:'Gli scaffali all\'altezza degli occhi ospitano spesso i prodotti più cari. Guarda in alto e in basso.'},
  {t:'Il numero che conta: il tasso di risparmio', acts:['Guarda la tua percentuale di risparmio nella Home.','Apri Grafici e confronta entrate e uscite degli ultimi mesi.','Scrivi una cifra realistica da risparmiare il prossimo mese.'],
    i:'Quanto guadagni conta, ma conta di più quanto ne resta. Il tasso di risparmio è la parte delle entrate che non spendi: (entrate − uscite) ÷ entrate.',
    deep:['Due persone con lo stesso stipendio possono avere situazioni opposte. Chi risparmia il 30% delle entrate costruisce in pochi anni un fondo di emergenza solido e raggiunge i propri obiettivi. Chi risparmia il 5% resta esposto a ogni imprevisto.','Il tasso di risparmio migliora in due modi: spendendo meno o guadagnando di più. Un aumento di stipendio, se le spese restano uguali, va tutto nel risparmio. È per questo che è importante non aumentare il tenore di vita a ogni aumento di reddito.'],
    tips:[['Inizia','Sotto il 10% sei in zona rossa: un imprevisto può metterti in difficoltà.'],['Inizia','Tra 11 e 25% c\'è margine da costruire. Tra 26 e 39% sei in buona salute.'],['Guadagna','Dal 40% in su stai costruendo patrimonio velocemente.'],['Inizia','Guardalo ogni mese, non ogni giorno: una settimana storta non cambia la direzione.']],
    pill:'Se a ogni aumento di stipendio ne risparmi almeno metà, il tuo tasso di risparmio cresce senza sacrifici.'},
  {t:'Quanto ti costa la banca', acts:['Trova nell\'estratto conto canone, commissioni, costo delle carte e imposta di bollo.','Somma tutto: è il costo annuo del tuo conto.','Confronta con almeno due conti a canone zero.'],
    i:'Canone, commissioni sui bonifici, costo della carta, imposta di bollo: messi insieme possono superare i 100 € all\'anno senza che tu te ne accorga.',
    deep:['Il documento di sintesi annuale che la banca ti invia riporta l\'indicatore dei costi complessivi: è il numero da guardare. Molti conti tradizionali hanno costi pensati per un uso che magari non fai più, come i prelievi allo sportello o gli estratti cartacei.','Cambiare conto oggi è più semplice di un tempo: esiste un servizio di trasferimento che sposta domiciliazioni e accrediti. Valuta però anche il servizio: se ti serve una filiale fisica, tienine conto.'],
    tips:[['Sostituisci','Esistono conti a canone zero, soprattutto online. Confronta il costo totale annuo.'],['Rinegozia','Chiedi alla banca un pacchetto più adatto a come usi davvero il conto.'],['Elimina','Chiudi conti e carte che non usi: ognuno può avere costi fissi.'],['Rinegozia','Mutuo: la surroga, cioè portarlo in un\'altra banca a condizioni migliori, per legge è senza costi per te.']],
    pill:'Sui conti con giacenza media sopra i 5.000 € si paga l\'imposta di bollo di 34,20 € all\'anno.'},
  {t:'Assicurazioni: confrontare a ogni rinnovo', acts:['Annota scadenza e premio di tutte le polizze: auto, casa, altre.','Per l\'RC auto, confronta i preventivi su Preventivass (servizio pubblico IVASS).','Controlla le garanzie accessorie che paghi e chiediti se ti servono.'],
    i:'Le polizze si rinnovano spesso in silenzio, anno dopo anno. Il momento del rinnovo è quello giusto per confrontare.',
    deep:['Per l\'RC auto la legge permette di cambiare compagnia alla scadenza senza disdetta. Preventivass, il servizio dell\'IVASS, mostra i preventivi delle compagnie per il tuo profilo: è un punto di partenza neutrale. Confronta sempre a parità di garanzie e massimali.','Nelle polizze spesso si accumulano garanzie accessorie: assistenza stradale doppia (magari già inclusa con l\'auto nuova), cristalli, tutela legale. Alcune sono utili, altre duplicate. Rileggerle una volta all\'anno è un piccolo lavoro che può valere molto.'],
    tips:[['Sostituisci','Confronta su Preventivass a parità di massimali e garanzie.'],['Rinegozia','Con un preventivo più basso in mano, chiedi al tuo assicuratore di adeguare il premio.'],['Elimina','Togli le garanzie doppie o che non ti servono più.'],['Sostituisci','Con un fondo di emergenza solido, valuta una franchigia più alta: il premio scende.']],
    pill:'Con l\'RC auto familiare un nuovo veicolo può ereditare la classe di merito più bassa di un familiare convivente, se rispetti le condizioni previste.'},
  {t:'L\'usato vale soldi', acts:['Scegli 3 oggetti che non usi da più di un anno.','Fotografali con luce naturale e mettine in vendita almeno uno.','Quando vendi, registra l\'entrata come "Vendita usato" e accantonala.'],
    i:'Ogni casa ha oggetti fermi da anni: elettronica, vestiti, attrezzi, giochi. Venderli porta un\'entrata extra e libera spazio.',
    deep:['Gli oggetti non usati perdono valore ogni anno che passa, soprattutto l\'elettronica. Venderli presto significa incassare di più. E c\'è un vantaggio nascosto: meno oggetti in casa significa meno cose da gestire, pulire, riordinare.','Sulle piattaforme di vendita contano tre cose: foto chiare, descrizione onesta (difetti compresi) e prezzo giusto. Guarda a quanto si vendono davvero oggetti simili, non a quanto vengono messi in vendita.'],
    tips:[['Guadagna','Subito, Vinted ed eBay rendono la vendita semplice. Foto con luce naturale vendono di più.'],['Guadagna','Metti un prezzo leggermente sotto la media: venderai prima.'],['Guadagna','Ogni euro dall\'usato va all\'obiettivo: vedere la barra crescere motiva.'],['Gratis','Quello che non vendi puoi regalarlo o scambiarlo: libera spazio comunque.']],
    pill:'Per la consegna a mano scegli luoghi pubblici e accetta pagamenti tracciabili.'},
  {t:'Il giorno a spesa zero', acts:['Oggi nessun acquisto oltre a quelli già programmati.','Prepara ieri sera o stamattina pranzo, merenda e caffè da portare.','Stasera annota cosa avresti comprato: sono le tue spese automatiche.'],
    i:'Una giornata senza spese ti mostra quante ne fai in automatico: il caffè, lo snack, l\'acquisto online della sera. Non è una punizione, è un esperimento.',
    deep:['Molte spese non sono decisioni, sono abitudini: le facciamo senza pensarci, negli stessi luoghi e negli stessi momenti. Una giornata a spesa zero interrompe l\'automatismo e lo rende visibile. Spesso la sera ci si accorge di quanti piccoli acquisti si sarebbero fatti.','Se ti piace, prova a ripeterla una volta a settimana. Non serve diventare rigidi: basta sapere quali sono le tue spese automatiche e decidere, ogni volta, se valgono davvero quei soldi.'],
    tips:[['Elimina','Prepara il giorno prima tutto quello che ti serve fuori casa.'],['Elimina','Togli le app di shopping dalla schermata principale, almeno per oggi.'],['Gratis','Programma una serata gratuita: passeggiata, film già in casa, cena con la dispensa.'],['Inizia','La lista delle spese "mancate" vale oro: guardala tra una settimana.']],
    pill:'Più è facile pagare, più si spende: il pagamento con un tocco riduce la percezione della spesa.'},

const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => iso(new Date());
const ymOf = s => s.slice(0, 7);
const curYM = () => ymOf(today());
const addMonths = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const monthsBetween = (a, b) => { const [y1, m1] = a.split('-').map(Number), [y2, m2] = b.split('-').map(Number); return (y2 - y1) * 12 + (m2 - m1); };
const ymLabel = (ym, opt) => new Date(ym + '-15T12:00:00').toLocaleDateString('it-IT', opt || {month:'long', year:'numeric'});
const dLabel = s => new Date(s + 'T12:00:00').toLocaleDateString('it-IT', {weekday:'long', day:'numeric', month:'long'});
const dshort = s => new Date(s + 'T12:00:00').toLocaleDateString('it-IT', {day:'numeric', month:'short'});
const daysBetween = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 864e5);
const dayOffset = (s, n) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + n); return iso(d); };
/* numeri all'italiana: il punto delle migliaia c'è sempre (anche 1.250), dal milione si abbrevia (1,25 Mln) */
const fmtN = (n, dec) => { const f = Math.abs(n).toFixed(dec || 0).split('.'); return f[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (f[1] ? ',' + f[1] : ''); };
const eur = (n, dec) => { if (typeof S !== 'undefined' && S && S.hide) return '••• €'; const a = Math.abs(n), sg = n < 0 ? '−' : '';
  if (a >= 1e6) return sg + (a >= 1e9 ? fmtN(a / 1e9, 2).replace(/,?0+$/, '') + ' Mld €' : fmtN(a / 1e6, 2).replace(/,?0+$/, '') + ' Mln €');
  return sg + fmtN(a, dec ? 2 : 0) + '\u00a0€'; };
const eur2 = n => eur(n, Math.round(n) !== n);
const parseAmt = v => { let t = String(v).trim().replace(/[€\s]/g, ''); if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.'); const x = parseFloat(t); return isNaN(x) ? 0 : Math.round(x * 100) / 100; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const NUMK = new Set(['a', 'target', 'saved', 'day', 'found', 'rata', 'months', 'taeg', 'balloon', 'tan', 'res', 'every', 'count', 'len', 'after', 'emergMonths', 'liqMonths', 'liq', 'emerg', 'inv']);
function clean(o, k, free){
  if (Array.isArray(o)) return o.map(x => clean(x, k, free));
  if (o && typeof o === 'object') { const r = {}; Object.keys(o).forEach(kk => { if (kk === '__proto__' || kk === 'constructor' || kk === 'prototype') return; const f = free || FREE.has(kk); if (!f && /[<>"'`&\;]/.test(kk)) return; r[kk] = clean(o[kk], kk, f); }); return r; }
  if (typeof o === 'string' && NUMK.has(k) && !free) { const v = parseFloat(o.replace(',', '.')); return isFinite(v) ? v : 0; }
  if (typeof o === 'string') return free ? o.slice(0, 500) : k === 'col' && !/^#[0-9a-f]{3,8}$/i.test(o) ? '' : o.replace(/[<>"'`&\;]/g, '').slice(0, 80);
  if (typeof o === 'number' && !isFinite(o)) return 0;

  S.xfers = S.xfers || []; S.dues = S.dues || []; S.dueCuts = S.dueCuts || []; S.wbi = S.wbi || {};
  if (!S.pilFrom) { const f = S.moves.filter(m => m.n === 'Saldo iniziale').map(m => m.d).sort()[0]; S.pilFrom = f || today(); }
  S.times = Object.assign(Object.fromEntries(WELL.map(w => [w.id, w.time])), S.times || {});
  S.tgt = S.tgt || {liq:null, emerg:null};
}

const STAGES = [[25,'#d95926','Si parte'],[50,'#e3a008','Verso metà strada'],[75,'#a8c23a','Oltre metà strada'],[100,'#22A45D','Quasi arrivato'],[Infinity,'#22A45D','Obiettivo raggiunto']];
const stageOf = pct => pct >= 100 ? STAGES[4] : STAGES.find(s => pct < s[0]);
/* investimenti: il "totale versato" si indica quando aggiorni il saldo (oggi o nello storico); dopo, si aggiungono i versamenti registrati.
   Il resto della differenza col saldo è il plus/minus, cioè l'andamento dei mercati. */
const invContrib = m => m.k === 'inv' && !m.hk && !m.hx && m.n !== 'Saldo iniziale' && !/^Correzione del saldo/.test(m.n || '');
function invPaidAt(ym){ const P = S.invPaid || {}, ks = Object.keys(P).filter(k => /^\d{4}-\d{2}-\d{2}$/.test(k) && k <= ym + '-32').sort(); if (!ks.length) return null;
  const k0 = ks[ks.length - 1]; return (+P[k0] || 0) + S.moves.concat(txEffects()).filter(m => invContrib(m) && m.d > k0 && m.d <= ym + '-32').reduce((t, m) => t + m.a, 0); }
function invPM(){ const v = invPaidAt(curYM()); if (v === null) return null; const val = pilBalance('inv'); return {paid:v, val, pm:val - v, pct:v > 0 ? (val - v) / v * 100 : null}; }
/* plus/minus di un mese: se il versato è noto a inizio e fine mese è la variazione non versata; altrimenti tutto ciò che non è un versamento registrato */
function invMarket(ym){ const mv = pillarMoves('inv').filter(m => ymOf(m.d) === ym), d = mv.reduce((t, m) => t + m.a, 0), a = invPaidAt(addMonths(ym, -1)), b = invPaidAt(ym);
  return a !== null && b !== null ? d - (b - a) : mv.filter(m => !invContrib(m)).reduce((t, m) => t + m.a, 0); }
const pmTxt = v => (v >= 0 ? '+' : '−') + eur(Math.abs(Math.round(v)));
function goalPace(g){
  const keys = ['g:' + g.id].concat(g.kind === 'emergenza' ? ['emerg'] : []), all = g.kind === 'patrimonio';
  const inPil = k => ['liq', 'emerg', 'inv'].includes(k) || (k.startsWith('g:') && !linkedGoal(S.goals.find(x => 'g:' + x.id === k)));
  /* patrimonio: conta tutto quello che cambia nei pilastri, tranne il saldo iniziale e il plus/minus degli investimenti */
  const mv = S.moves.concat(txEffects()).filter(m => !m.hx && m.n !== 'Saldo iniziale' && (all ? inPil(m.k) : keys.includes(m.k) && m.n !== 'Correzione del saldo'));
  const first = mv.length ? mv.map(m => ymOf(m.d)).sort()[0] : null;
  const month = ym => mv.filter(m => ymOf(m.d) === ym).reduce((t, m) => t + m.a, 0) - (all ? invMarket(ym) : 0);
  const n = first ? Math.min(24, monthsBetween(first, curYM())) : 0;
  if (n < 1) return {pace:Math.max(0, month(curYM())), any:mv.length > 0, n:0, trim:false};
  const vals = Array.from({length:n}, (_, i) => month(addMonths(curYM(), i - n)));
  return {pace:Math.max(0, robustAvg(vals)), any:true, n, trim:n >= 6};
}

function coachMsgs(){
  const out = [], s = stats(curYM()), g = mainGoal();
  if (pilBalance('liq') < 0) out.push({i:'wallet', c:'#E5484D', t:'La liquidità è sotto zero (' + eur(pilBalance('liq')) + '): dal conto sono uscite più spese di quante entrate hai registrato.', b:'Saldo della liquidità'});
  if (g) { const p = goalPlan(g), {pace, any} = goalPace(g);
    if (p.left && any && pace > 0) { const eta = addMonths(curYM(), Math.ceil(p.left / pace)), d = monthsBetween(eta, g.date);
      out.push({i:'target', c:d >= 0 ? '#22A45D' : '#d95926', t:'Se mantieni questo ritmo (' + eur(Math.round(pace)) + ' al mese), raggiungerai «' + g.name + '» ' + (d > 0 ? 'con ' + d + (d === 1 ? ' mese' : ' mesi') + ' di anticipo.' : d === 0 ? 'proprio alla scadenza.' : 'con ' + (-d) + (d === -1 ? ' mese' : ' mesi') + ' di ritardo: servirebbero ' + eur(p.need) + ' al mese.'), b:'Media di tutti i mesi registrati (fino a 24): un mese eccezionale non la sposta'}); }
    else if (p.left) out.push({i:'target', c:'#e3a008', t:'Per «' + g.name + '» non hai ancora accantonato nulla: servono ' + eur(p.need) + ' al mese fino a ' + ymLabel(g.date, {month:'long', year:'numeric'}) + '.', b:'Cifra mancante divisa per i mesi alla scadenza'}); }
  S.goals.filter(x => !linkedGoal(x) && x !== g).forEach(x => { const p = goalPlan(x); if (p.left && monthsBetween(curYM(), x.date) <= 3) out.push({i:'calendar', c:'#e3a008', t:'Hai previsto «' + x.name + '» entro ' + ymLabel(x.date, {month:'long'}) + ', ma mancano ' + eur(p.left) + ': servono ' + eur(p.need) + ' al mese.', b:'Obiettivi con scadenza entro 3 mesi'}); });
  const avg = {}; S.cats.out.forEach(c => { avg[c.id] = [1, 2, 3].reduce((t, k) => t + (stats(addMonths(curYM(), -k)).byCat[c.id] || 0), 0) / 3; });
  const spikes = S.cats.out.map(c => ({c, a:s.byCat[c.id] || 0, m:avg[c.id]})).filter(x => x.m > 0 && x.a - x.m >= 15 && x.a / x.m >= 1.15).sort((a, b) => (b.a - b.m) - (a.a - a.m));
  spikes.slice(0, 2).forEach(x => out.push({i:x.c.i, c:OUT_COL, t:'Questo mese le spese per ' + x.c.n.toLowerCase() + ' sono già aumentate del ' + Math.round((x.a / x.m - 1) * 100) + '%: ' + eur(x.a) + ' contro una media di ' + eur(Math.round(x.m)) + '.', b:'Mese in corso rispetto alla media dei 3 mesi precedenti'}));
  const ess = avgEssential(); if (ess > 0) { const mo = pilBalance('emerg') / ess; if (mo < 3) out.push({i:'shield', c:'#d95926', t:'Il fondo di emergenza copre ' + mo.toFixed(1).replace('.', ',') + ' mesi di spese essenziali. L\'indicazione più diffusa è di avere da 3 a 6 mesi.', b:'Fondo di emergenza ÷ spese essenziali medie (' + eur(Math.round(ess)) + ' al mese)'}); }
  const prev = stats(addMonths(curYM(), -1));
  if (s.rate !== null && prev.rate !== null && Math.abs(s.rate - prev.rate) >= 5) out.push({i:'chart', c:s.rate > prev.rate ? '#22A45D' : '#d95926', t:'Il tasso di risparmio è ' + Math.round(s.rate) + '%, ' + (s.rate > prev.rate ? 'in crescita' : 'in calo') + ' di ' + Math.round(Math.abs(s.rate - prev.rate)) + ' punti rispetto al mese scorso.', b:'Entrate e uscite registrate'});
  upcomingDues().slice(0, 1).forEach(d => out.unshift({i:'calendar', c:'#e3a008', t:(dueDays(d) < 0 ? esc(d.n) + ' è scaduto' : 'Tra ' + dueDays(d) + ' giorni scade ' + esc(d.n)) + ' (' + eur2(d.a) + ' ' + FREQ[d.freq][0] + '). Rinnovi, rinegozi, riduci o disdici?', b:'Il tuo calendario delle scadenze', go:{screen:'dues', open:d.id}}));
  const last = S.tx.map(x => x.d).filter(d => d <= today()).sort().pop();
  if (last && daysBetween(last, today()) >= 3) out.push({i:'list', c:'#3987e5', t:'Non registri movimenti da ' + daysBetween(last, today()) + ' giorni: hai speso qualcosa? Segnalo adesso, poi prova a farlo appena paghi.', b:'Data dell\'ultimo movimento'});
  return out.slice(0, 4);
}

/* ---------- simulatore ---------- */
const SIM_PRESETS = [['prudente', 'Prudente', 2, 'Conti deposito, titoli di Stato brevi'], ['obblig', 'Obbligazionario', 3, 'Obbligazioni diversificate'], ['misto', 'Misto', 4.5, 'Metà azioni, metà obbligazioni'], ['azion', 'Azionario globale', 6.5, 'Azioni di tutto il mondo']];
let SIM = null;
function simRun(cap, mon, rate, years){
  const r = Math.pow(1 + rate / 100, 1 / 12) - 1; let v = cap, paid = cap; const ys = [];
  for (let m = 1; m <= years * 12; m++) { v = v * (1 + r) + mon; paid += mon; if (m % 12 === 0) ys.push({y:m / 12, v, paid}); }
  return {v, paid, ys};
}
function renderSim(){
  if (!SIM) SIM = {cap:Math.round(pilBalance('inv')) || 0, mon:Math.max(50, Math.round(Math.max(0, avgSave()) / 10) * 10 || 100), preset:'misto', rate:4.5, years:20, infl:true};
  const P = SIM, res = simRun(P.cap, P.mon, P.rate, P.years), plus = simRun(P.cap, P.mon + 100, P.rate, P.years);
  const defl = v => P.infl ? v / Math.pow(1.02, P.years) : v;
  const mx = Math.max(1, ...res.ys.map(y => y.v));
  const hz = [5, 10, 20].map(y => ({y, r:simRun(P.cap, P.mon, P.rate, y)}));
  const sc = SIM_PRESETS.map(x => ({x, v:simRun(P.cap, P.mon, x[2], P.years).v})), mxs = Math.max(...sc.map(z => z.v));
  view.innerHTML = '<div class="sec" style="gap:20px">' + backBtn('Pilastri', {screen:'pillars'}) +
    '<div class="intro"><span class="marker y" style="font-size:1.05rem">Simulatore del futuro</span><h2>Quanto possono diventare i tuoi risparmi?</h2><p class="muted">Il tempo e l\'interesse composto lavorano per te: guarda cosa succede cambiando cifra, anni e rendimento.</p></div>' +
    '<div class="card"><div class="grid2"><div class="field"><label for="sm-cap">Capitale iniziale</label><div class="eur"><input id="sm-cap" inputmode="none" readonly data-pad value="' + P.cap + '"></div></div><div class="field"><label for="sm-mon">Risparmio mensile</label><div class="eur"><input id="sm-mon" inputmode="none" readonly data-pad value="' + P.mon + '"></div></div></div>' +
      '<div class="field"><label for="sm-y">Anni: <b style="color:var(--fg)">' + P.years + '</b></label><input id="sm-y" type="range" min="1" max="40" value="' + P.years + '" style="padding:0;border:0;background:none;accent-color:var(--yellow)"></div>' +
      '<div class="sec" style="gap:8px"><span class="label">Rendimento annuo ipotizzato</span><div class="seg">' + SIM_PRESETS.map(x => '<button data-pre="' + x[0] + '" aria-pressed="' + (P.preset === x[0]) + '">' + x[1] + ' ' + String(x[2]).replace('.', ',') + '%</button>').join('') + '<button data-pre="custom" aria-pressed="' + (P.preset === 'custom') + '">Personalizzato</button></div>' +

      '<label class="check small"><input type="checkbox" id="sm-inf"' + (P.infl ? ' checked' : '') + '> Mostra anche il valore reale, al netto di un\'inflazione del 2% annuo</label></div>' +
    '<div class="card"><span class="label">Tra ' + P.years + (P.years === 1 ? ' anno' : ' anni') + '</span><div class="simres"><b class="num">' + eur(Math.round(res.v)) + '</b>' + (P.infl ? '<span class="small muted">circa ' + eur(Math.round(defl(res.v))) + ' in potere d\'acquisto di oggi</span>' : '') + '</div>' +

      '<div class="legend small"><span><i class="sw" style="background:#6b6b66"></i>Versato</span><span><i class="sw" style="background:var(--yellow)"></i>Crescita</span></div>' +

  const upd = () => { P.cap = parseAmt(val('sm-cap')); P.mon = parseAmt(val('sm-mon')); P.years = +val('sm-y'); if (P.preset === 'custom') P.rate = parseAmt(val('sm-r')); const y = window.scrollY; renderSim(); window.scrollTo({top:y}); };

  document.getElementById('sm-y').oninput = upd;

const FREQ = {y:['all\'anno', 12], m:['al mese', 1], q:['ogni 3 mesi', 3], o:['una volta', 0]};

function mState(){ S.mis = S.mis || {active:{}, done:[]}; return S.mis; }
function mXP(){ return mState().done.reduce((t, d) => t + d.xp, 0) + Object.keys(S.learn || {}).reduce((t, k) => t + Math.min(10, (S.learn[k].quiz || 0) * 2), 0) + ((S.qd || {}).ok || 0) * 2; }
function mLevel(){ const x = mXP(); let i = 0; MLEVELS.forEach((l, k) => { if (x >= l[0]) i = k; }); const next = MLEVELS[i + 1]; return {x, name:MLEVELS[i][1], i, next, pct:next ? (x - MLEVELS[i][0]) / (next[0] - MLEVELS[i][0]) * 100 : 100}; }
function mProgress(M, st){
  if (M.type === 'days') return st.log.filter(e => e.ok).length;
  if (M.type === 'count' || M.type === 'compare') return st.log.length;
  if (M.type === 'amount') return st.log.reduce((t, e) => t + e.a, 0);
  if (M.auto === 'usato') return S.tx.filter(x => x.t === 'in' && x.c === 'usato' && x.d >= st.start).length;
  if (M.auto === 'track') return new Set(S.tx.filter(x => x.d >= st.start && x.d <= today()).map(x => x.d)).size;
  return 0;
}
let mTarget = (M, st) => M.type === 'amount' || M.type === 'roundup' ? st.target : M.n;
function mSaved(M, st){ if (M.type === 'compare') return st.log.reduce((t, e) => t + Math.max(0, e.hi - e.paid), 0); if (M.type === 'amount') return mProgress(M, st); return st.log.reduce((t, e) => t + (e.a || 0), 0); }
function mCheckDone(M){
  const st = mState().active[M.id]; if (!st || mProgress(M, st) < mTarget(M, st)) return false;
  mState().done.push({id:M.id, d:today(), xp:M.xp, saved:mSaved(M, st), start:st.start}); delete mState().active[M.id]; save();
  toast('Missione completata! +' + M.xp + ' punti'); return true;
}

}

function qState(){ S.qd = S.qd || {n:0, ok:0, streak:0, last:null}; return S.qd; }

    (done ? '<p class="small" style="margin:0"><b>' + (st.ans.a === Q.a ? 'Esatto! +2 punti.' : 'Non proprio.') + '</b> ' + Q.e + '</p>' + (L ? '<button class="textlink small" style="align-self:flex-start" ' + nav$({screen:'lesson', id:L.id}) + '>Approfondisci: ' + L.t + '</button>' : '') + '<div class="spread"><span class="small muted">La prossima domanda arriva domani.</span>' + (QOPEN ? '<button class="textlink small" id="qd-close">Chiudi</button>' : '') + '</div>' : '') + '</div>';

function bindQ(re){ const keep = () => { const y = window.scrollY; re(); window.scrollTo({top:y}); };
  const op = view.querySelector('#qd-open'); if (op) op.onclick = () => { QOPEN = true; keep(); };
  const cl = view.querySelector('#qd-close'); if (cl) cl.onclick = () => { QOPEN = false; keep(); };
  view.querySelectorAll('[data-qd]').forEach(b => b.onclick = () => { const st = qState(); if (st.last === today()) return; const i = st.n % QUIZ.length, a = +b.dataset.qd;
  QOPEN = true; st.streak = st.last === dayOffset(today(), -1) ? (st.streak || 0) + 1 : 1; st.last = today(); st.n++; if (a === QUIZ[i].a) st.ok = (st.ok || 0) + 1; st.ans = {i, a}; save(); const y = window.scrollY; re(); window.scrollTo({top:y}); }); }

    const v = document.getElementById('df-v'); if (v) { v.focus(); v.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); nx && nx.click(); } }; }
    const sv = view.querySelector('#df-save'); if (sv) sv.onclick = () => { const rec = {kind:DF.kind, n:DF.n, rata:+DF.rata, months:+DF.months, taeg:+DF.taeg, balloon:DF.hasB ? +DF.balloon : 0, start:today()};
      if (R.form === 'new') S.debts.push(Object.assign({id:uid()}, rec)); else Object.assign(S.debts.find(x => x.id === R.form), rec); DF = null; save(); toast('Finanziamento salvato'); nav({screen:'debts'}); };
    const del = view.querySelector('#db-del'); if (del) del.onclick = () => { S.debts = S.debts.filter(x => x.id !== R.form); DF = null; save(); nav({screen:'debts'}); };
  }
  view.querySelectorAll('[data-ex]').forEach(b => b.onclick = () => nav({screen:'debts', open:R.open, extra:+b.dataset.ex}));
}

LESSONS.push(
  {id:'budget', cat:'risp', t:'Analizzare entrate e uscite: si decide dopo', p:['Molti partono da un budget: un limite deciso prima, categoria per categoria. Spesso salta alla prima occasione e lascia solo sensi di colpa. Questa app segue la strada opposta: registri tutto con onestà, guardi i fatti e decidi dopo.','Per leggere i numeri c\'è un riferimento molto diffuso, il 50/30/20: circa il 50% delle entrate per i bisogni (casa, bollette, spesa, trasporti), il 30% per i desideri, il 20% per risparmio e rimborso dei debiti. Non è un limite da rispettare: è uno specchio per capire dove sei.','Il momento giusto per guardare è la revisione mensile. Confronta entrate e uscite, cerca le categorie che crescono, poi scendi con l\'Analisi nelle sottocategorie fino al singolo movimento: è lì che si scoprono le cose che non ti aspetti.','Alla fine scegli una sola cosa da cambiare il mese dopo. Una decisione concreta presa sui fatti vale più di dieci regole decise prima e mai rispettate.'],
    q:[{q:'Perché questa app non usa i budget?', o:['I budget sono vietati','Un limite deciso prima spesso salta: meglio guardare i fatti e decidere dopo','I numeri non servono'], a:1},{q:'Nella regola 50/30/20 il 20% va a…', o:['Desideri','Risparmio e debiti','Bisogni'], a:1},{q:'Ogni quanto ha senso analizzare con calma entrate e uscite?', o:['Ogni ora','Una volta al mese, con la revisione mensile','Mai: basta registrarle'], a:1},{q:'Una categoria cresce ogni mese. Cosa fai?', o:['La ignoro','Scendo nelle sottocategorie e nei movimenti per capire perché','Mi impongo un limite rigido da domani'], a:1},{q:'Dopo l\'analisi del mese conviene…', o:['Cambiare tutto insieme','Scegliere una sola cosa concreta da cambiare','Non cambiare nulla'], a:1}]},

  {id:'invisibili', cat:'risp', t:'Le spese invisibili', p:['Le spese invisibili sono piccole, frequenti e automatiche: abbonamenti, commissioni, caffè, snack, consegne, app. Una per una non pesano, insieme sì.','Il trucco per vederle è annualizzarle: 2 € al giorno sono 730 € all\'anno, 9,99 € al mese sono quasi 120 € all\'anno. Guardate in euro all\'anno, molte spese cambiano aspetto.','Non serve eliminarle tutte: serve scegliere. Tieni quelle che ti danno davvero piacere o valore, togli quelle che fai solo per abitudine.','In questa app le trovi nel coach ("piccole spese sotto i 10 €") e nelle statistiche per categoria.'],
    q:[{q:'2 € al giorno quanto fanno in un anno?', o:['Circa 73 €','Circa 730 €','Circa 7.300 €'], a:1},{q:'Il modo migliore per valutare un abbonamento è guardarne il costo…', o:['Giornaliero','Annuale','Settimanale'], a:1}]},
  {id:'emotivi', cat:'risp', t:'Acquisti emotivi: perché compriamo', p:['Molti acquisti non nascono da un bisogno ma da un\'emozione: noia, stress, tristezza, voglia di premiarsi. I negozi online lo sanno bene: offerte a tempo, "ultimi pezzi", acquisto con un clic.','Riconoscere il momento è il primo passo. Prima di comprare chiediti: come mi sento adesso? Lo comprerei anche domani, a mente fredda?','Strumenti semplici funzionano: la regola delle 48 ore, togliere le carte salvate, disiscriversi dalle newsletter, una lista dei desideri dove "parcheggiare" le cose che vuoi.','E soprattutto trova alternative per l\'emozione: una camminata, una telefonata, la respirazione guidata della sezione Benessere. Non a caso stare bene aiuta anche i conti.'],
    q:[{q:'Prima di un acquisto d\'impulso può aiutare…', o:['Comprare subito prima che finisca l\'offerta','Aspettare 48 ore','Comprarne due'], a:1},{q:'Gli acquisti emotivi nascono spesso da…', o:['Un bisogno reale','Noia, stress o voglia di premiarsi','Un piano preciso'], a:1}]},
  {id:'smart', cat:'risp', t:'Obiettivi che si raggiungono', p:['Un obiettivo vago ("risparmiare di più") si dimentica in fretta. Un obiettivo concreto ("3.000 € per il viaggio entro agosto") si può misurare e seguire.','Funziona dividere la cifra per i mesi che hai: diventa una quota mensile, il "passo giusto" che trovi in ogni obiettivo dell\'app.','Dare un nome e un\'immagine all\'obiettivo aiuta a resistere alle tentazioni: non stai rinunciando a una cena fuori, stai pagando un pezzo del viaggio.','E festeggia le tappe: il 25%, il 50%, il 75%. La motivazione si nutre di piccoli traguardi.'],

  {id:'debiti', cat:'debt', t:'Debiti buoni e debiti cattivi', p:['Non tutti i debiti sono uguali. Un mutuo per la casa in cui vivi, a un tasso contenuto, è molto diverso da un acquisto a rate di un telefono o da una carta revolving al 18%.','Due sigle da conoscere: il TAN è il tasso di interesse annuo; il TAEG include anche spese e commissioni ed è il numero giusto per confrontare due finanziamenti.','Le carte revolving e molti piccoli prestiti al consumo hanno tassi alti: quando il TAN supera il 10%, ogni euro restituito prima è un risparmio certo e immediato.','Per uscire dai debiti ci sono due metodi diffusi. "Valanga": chiudi prima quello con il tasso più alto, così paghi meno interessi in totale. "Palla di neve": chiudi prima il più piccolo, per sentirti libero prima e mantenere la motivazione. La sezione Finanziamenti e debiti ti mostra entrambi gli ordini.','Prima di un rimborso anticipato controlla il contratto: per alcuni finanziamenti possono esserci commissioni, di solito limitate per legge.'],
    q:[{q:'Per confrontare due finanziamenti conviene guardare…', o:['Il TAN','Il TAEG','La durata'], a:1},{q:'Il metodo "valanga" consiste nel chiudere prima…', o:['Il debito più piccolo','Il debito con il tasso più alto'], a:1}], link:['Calcola i tuoi interessi', 'debts']},
  {id:'taeg', cat:'debt', t:'Leggere un contratto di finanziamento', p:['Prima di firmare un finanziamento, la banca o la finanziaria deve consegnarti il modulo "Informazioni europee di base sul credito ai consumatori", detto SECCI (per i mutui si chiama PIES). È un foglio standard, uguale per tutti: serve proprio a confrontare offerte diverse. Chiedilo sempre e portalo a casa prima di decidere.','Il TAN è solo il tasso di interesse. Il TAEG (Tasso Annuo Effettivo Globale) comprende anche spese di istruttoria, incasso rata, assicurazioni obbligatorie e imposte: è il costo vero, in percentuale all\'anno. Due prestiti con lo stesso TAN possono avere TAEG molto diversi. Per confrontare, guarda sempre il TAEG.','Nel SECCI cerca altri due numeri: il "costo totale del credito" (quanto paghi in più rispetto a quello che ricevi) e l\'"importo totale dovuto" (tutto quello che restituirai). Esempio: prendi 10.000 € e restituisci 12.400 €? Il finanziamento ti costa 2.400 €. Vederlo in euro cambia la prospettiva.','Attenzione alla maxi-rata finale, frequente nei finanziamenti auto: rate basse per qualche anno e poi una rata finale molto alta, da pagare, rifinanziare o coprire restituendo l\'auto. Le rate basse fanno sembrare tutto leggero, ma il TAEG di solito è alto.','Altre cose da controllare: se il tasso è fisso o variabile; se ci sono assicurazioni o servizi aggiuntivi e se sono davvero obbligatori; le spese per ogni rata; cosa succede se salti un pagamento. Per il credito ai consumatori hai 14 giorni per ripensarci (diritto di recesso).','Rimborso anticipato: puoi sempre chiudere prima, tutto o in parte, pagando solo gli interessi maturati. Per i prestiti al consumo il contratto può prevedere un indennizzo, che per legge non supera l\'1% della somma rimborsata (0,5% se manca meno di un anno). Sui mutui per l\'acquisto o la ristrutturazione della prima casa di una persona fisica non ci sono penali.','Dove trovi i dati per questa app: la rata e il numero di rate mancanti sono nel piano di ammortamento o nell\'area clienti online; il TAEG è nel contratto o nel SECCI. Inserendoli nella sezione Finanziamenti e debiti vedi quanto ti costa ancora ogni prestito e cosa cambia versando qualcosa in più.'],
    q:[{q:'Per confrontare due finanziamenti guardi…', o:['Il TAN','Il TAEG','Solo la rata'], a:1},{q:'Il "costo totale del credito" è…', o:['Quello che ricevi','Quanto paghi in più rispetto a quello che ricevi','La prima rata'], a:1},{q:'Rate molto basse con una grossa rata finale sono…', o:['Sempre convenienti','Una maxi-rata: controlla il TAEG e la rata finale'], a:1}], link:['Inserisci i tuoi finanziamenti', 'debts']},
  {id:'revolving', cat:'debt', t:'Carte revolving e rate: attenzione', p:['Una carta revolving permette di rimborsare a piccole rate mensili quello che spendi. Comodo, ma i tassi sono spesso tra il 15% e il 20% annuo.','Esempio: 2.000 € su una revolving al 18% pagando 60 € al mese richiedono circa 4 anni per chiudere il debito, con quasi 800 € di interessi.','Gli acquisti "a rate a tasso zero" possono essere convenienti, ma leggi bene: a volte ci sono spese di istruttoria o servizi aggiuntivi che fanno salire il TAEG.','Regola semplice: compra a rate solo ciò che compreresti comunque in contanti, e mai per spese di tutti i giorni.'],
    q:[{q:'Le carte revolving hanno di solito tassi…', o:['Molto bassi','Alti, spesso tra 15% e 20%'], a:1},{q:'"Tasso zero" significa sempre nessun costo?', o:['Sì','No, controlla il TAEG e le spese'], a:1}], link:['Calcola i tuoi interessi', 'debts']}
);

/* azioni sulla selezione, in una finestra: prima cosa fare, poi dove, poi conferma */
function catActions(t, selC, lsel, done){
  const nC = selC.length, nS = lsel.length, movC = selC.reduce((a, c) => a + catUse(t, c.id), 0), movS = lsel.reduce((a, q) => a + catUse(t, q.c.id, q.sb), 0);
  const what = nC ? nC + (nC === 1 ? ' categoria' : ' categorie') : nS + (nS === 1 ? ' sottocategoria' : ' sottocategorie'), mov = nC ? movC : movS;
  const names = (nC ? selC.map(c => c.n) : lsel.map(q => q.sb)).slice(0, 6).map(esc).join(', ') + (nC + nS > 6 ? '…' : '');
  catPop('<div class="cxact"></div>', (o, close) => {
    const box = o.querySelector('.cxact'), finish = msg => { save(); close(); toast(msg); done(); };
    const head = '<div class="spread"><b style="font-size:1.1rem">' + what + '</b><button class="textlink" data-x>Chiudi</button></div><p class="small muted" style="margin:0">' + names + (mov ? ' · ' + movN(mov) : '') + '</p>';
    const opt = (k, title, desc, danger) => '<button class="actopt' + (danger ? ' danger' : '') + '" data-act="' + k + '"><b>' + title + '</b><span>' + desc + '</span></button>';
    const pick = (title, list, go) => { box.innerHTML = head + '<b>' + title + '</b><div class="actlist">' + list.map(c => '<button data-dest="' + c.id + '">' + catTile(t, c) + '<span>' + esc(c.n) + '</span></button>').join('') + '</div><button class="textlink" data-back>‹ Indietro</button>';
      box.querySelectorAll('[data-dest]').forEach(b => b.onclick = () => go(S.cats[t].find(x => x.id === b.dataset.dest))); box.querySelector('[data-back]').onclick = menu; };
    const confirm = (text, label, fn, danger) => { box.innerHTML = head + '<p style="margin:0">' + text + '</p><div class="row"><button class="btn' + (danger ? ' danger' : '') + '" id="ac-ok">' + label + '</button><button class="btn ghost" data-back>Indietro</button></div>';
      box.querySelector('#ac-ok').onclick = fn; box.querySelector('[data-back]').onclick = menu; };
    const others = S.cats[t].filter(c => !selC.includes(c));
    function menu(){
      if (nC && nS) { box.innerHTML = head + '<p style="margin:0">Hai selezionato sia categorie sia sottocategorie. Le azioni sono diverse: tieni solo le une o solo le altre.</p><button class="btn ghost" data-x>Ok</button>'; return; }
      box.innerHTML = head + '<div class="actopts">' + (nC
        ? opt('into', 'Mettile dentro un\'altra categoria', 'Diventano sue sottocategorie, con i loro movimenti') + opt('merge', 'Unisci a un\'altra categoria', 'I movimenti passano lì, le sottocategorie si sommano') + opt('del', 'Elimina', mov ? 'Prima scegli dove spostare i ' + movN(mov) : 'Non hanno movimenti', true)
        : opt('move', 'Sposta in un\'altra categoria', 'Restano sottocategorie, con i loro movimenti') + opt('own', 'Rendile categorie', 'Ognuna diventa una categoria a sé') + opt('del', 'Elimina', mov ? 'I ' + movN(mov) + ' restano nella categoria, senza sottocategoria' : 'Non hanno movimenti', true)) + '</div>';
      box.querySelectorAll('[data-act]').forEach(b => b.onclick = () => { const k = b.dataset.act;
        if (nC && !others.length && k !== 'del') return toast('Lascia almeno una categoria non selezionata');
        if (k === 'into') pick('Dentro quale categoria?', others, d => confirm(names + ' diventano sottocategorie di <b>' + esc(d.n) + '</b>.', 'Conferma', () => { selC.forEach(c => opCatInto(t, c, d)); CATX.open.add(d.id); finish('Ora sono dentro ' + d.n); }));
        else if (k === 'merge') pick('A quale categoria?', others, d => confirm(names + ' vengono unite a <b>' + esc(d.n) + '</b> e poi spariscono.', 'Unisci', () => { selC.forEach(c => opCatMerge(t, c, d)); finish('Unite a ' + d.n); }));
        else if (k === 'move') pick('In quale categoria?', S.cats[t], d => confirm(names + ' passano in <b>' + esc(d.n) + '</b>.', 'Sposta', () => { lsel.forEach(q => { if (q.c.id !== d.id) opSubMove(t, q.c, q.sb, d.id); }); CATX.open.add(d.id); finish('Spostate in ' + d.n); }));
        else if (k === 'own') confirm(names + ' diventano categorie a sé.', 'Conferma', () => { lsel.forEach(q => opSubMove(t, q.c, q.sb, '__own')); finish('Ora sono categorie'); });
        else if (nC && movC) { if (!others.length) return toast('Serve almeno una categoria dove spostare i movimenti'); pick('Dove sposto i loro movimenti?', others, d => confirm('Elimini ' + names + '. I movimenti passano in <b>' + esc(d.n) + '</b>.', 'Elimina', () => { selC.forEach(c => opCatDel(t, c, catUse(t, c.id) ? d : null)); finish('Eliminate'); }, true)); }
        else confirm('Elimini ' + names + '.' + (nS && movS ? ' I movimenti restano nella loro categoria, senza sottocategoria.' : ''), 'Elimina', () => { if (nC) selC.forEach(c => opCatDel(t, c, null)); else lsel.forEach(q => opSubDel(t, q.c, q.sb)); finish('Eliminate'); }, true); }); }
    menu(); });
}

    (downloads ? '<button class="btn" id="card">Salva la card</button>' : '') +
    (notes.length ? '<div class="sec"><span class="label">Il tuo diario</span><div class="list">' + notes.map(e => '<div class="item" style="grid-template-columns:auto 1fr"><span class="ic">' + (e.day + 1) + '</span><span class="t"><b style="white-space:normal">' + esc(e.note) + '</b><span class="sub">' + esc((GYM[e.day].r || GYM[e.day]).t) + (e.found ? ' · ' + eur(e.found) + '/anno' : '') + '</span></span></div>').join('') + '</div></div>' : '') +
    '<button class="textlink" id="again">Ricomincia la palestra da capo</button></div>';
  const c = view.querySelector('#card'); if (c) c.onclick = () => saveCard(found, c);
  view.querySelector('#again').onclick = () => { S.gym = {start:today(), log:[]}; S.read = []; save(); nav({screen:'gym'}); };
}
async function saveCard(found, btn){

  try {

    const W = 1080, H = 1920, cv = document.createElement('canvas'); cv.width = W; cv.height = H; const x = cv.getContext('2d');

    const gr = x.createRadialGradient(W / 2, 1150, 50, W / 2, 1150, 760); gr.addColorStop(0, 'rgba(255,201,10,.2)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); x.fillStyle = gr; x.fillRect(0, 0, W, H);
    const img = new Image(); img.src = LOGO; await img.decode(); const lw = 360, lh = lw * img.height / img.width; x.drawImage(img, (W - lw) / 2, 150, lw, lh);
    x.textAlign = 'center'; let y = 150 + lh + 130;
    x.fillStyle = '#FFC90A'; x.font = '58px "Permanent Marker", cursive'; x.fillText('21 tappe completate', W / 2, y);
    x.fillStyle = '#FFF'; x.font = '900 86px Archivo, Arial, sans-serif'; x.fillText('Campione', W / 2, y + 140); x.fillText('del risparmio', W / 2, y + 240);
    x.fillStyle = '#FFC90A'; x.font = '900 150px Archivo, Arial, sans-serif'; x.fillText(eur(found), W / 2, y + 450);
    x.fillStyle = '#DDD'; x.font = '500 50px Figtree, Arial, sans-serif'; x.fillText('di risparmi trovati all\'anno', W / 2, y + 530);
    x.fillStyle = '#FFC90A'; x.fillRect((W - 460) / 2, H - 180, 460, 90); x.fillStyle = '#000'; x.font = '52px "Permanent Marker", cursive'; x.fillText('@Buddy4free', W / 2, H - 116);
    const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    await downloads.save({filename:'buddy4free-campione-risparmio.png', data:blob}); toast('Card salvata');
  } catch(e) { if (e && e.code !== 'declined') toast('Non è stato possibile salvare la card'); }
  btn.disabled = false;
}

/* ---------- breathing with sound ---------- */
let AC = null;
function ac(){ try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e) { AC = null; } return AC; }
function bell(freq, when, vol, dur){
  const c = ac(); if (!c || !S.sound) return; const t = c.currentTime + (when || 0);
  [[1, 1], [2.76, .35], [5.4, .12]].forEach(([m, g]) => { const o = c.createOscillator(), v = c.createGain(); o.type = 'sine'; o.frequency.value = freq * m;
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime((vol || .25) * g, t + .02); v.gain.exponentialRampToValueAtTime(.0001, t + (dur || 2.6)); o.connect(v); v.connect(c.destination); o.start(t); o.stop(t + (dur || 2.6) + .1); });
}
const Ambient = {
  nodes:null,
  start(){
    const c = ac(); if (!c || !S.sound || this.nodes) return;
    const out = c.createGain(); out.gain.value = 0; out.connect(c.destination); out.gain.linearRampToValueAtTime(1, c.currentTime + 2);
    const pad = c.createGain(); pad.gain.value = .035; pad.connect(out);
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 600; lp.connect(pad);
    const oscs = [110, 164.8, 220.5].map(f => { const o = c.createOscillator(); o.type = 'sine'; o.frequency.value = f; o.connect(lp); o.start(); return o; });
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    let last = 0; for (let i = 0; i < len; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }
    const noise = c.createBufferSource(); noise.buffer = buf; noise.loop = true;
    const bp = c.createBiquadFilter(); bp.type = 'lowpass'; bp.frequency.value = 900;
    const wave = c.createGain(); wave.gain.value = .02; noise.connect(bp); bp.connect(wave); wave.connect(out); noise.start();
    const tone = c.createOscillator(), tg = c.createGain(); tone.type = 'sine'; tone.frequency.value = 196; tg.gain.value = 0; tone.connect(tg); tg.connect(out); tone.start();
    this.nodes = {out, oscs, noise, wave, tone, tg};
  },
  phase(kind, secs){
    const n = this.nodes; if (!n) return; const t = AC.currentTime;
    [n.wave.gain, n.tg.gain, n.tone.frequency].forEach(p => { p.cancelScheduledValues(t); p.setValueAtTime(p.value, t); });
    if (kind === 'in') { n.wave.gain.linearRampToValueAtTime(.16, t + secs); n.tg.gain.linearRampToValueAtTime(.045, t + secs * .5); n.tone.frequency.linearRampToValueAtTime(294, t + secs); }
    else if (kind === 'out') { n.wave.gain.linearRampToValueAtTime(.015, t + secs); n.tg.gain.linearRampToValueAtTime(0, t + secs); n.tone.frequency.linearRampToValueAtTime(196, t + secs); }
    else n.tg.gain.linearRampToValueAtTime(.012, t + .8);
  },
  stop(){
    const n = this.nodes; if (!n) return; this.nodes = null; const t = AC.currentTime;
    n.out.gain.cancelScheduledValues(t); n.out.gain.setValueAtTime(n.out.gain.value, t); n.out.gain.linearRampToValueAtTime(0, t + 1.2);
    setTimeout(() => { try { n.oscs.forEach(o => o.stop()); n.noise.stop(); n.tone.stop(); n.out.disconnect(); } catch(e) {} }, 1400);
  }
};
let breathRun = null;
function stopBreath(){ if (breathRun) { clearTimeout(breathRun.t); clearInterval(breathRun.iv); breathRun = null; Ambient.stop(); } }
function renderBreath(){
  let tech = 'quadrata', mins = 2;
  const draw = () => {
    view.innerHTML = '<div class="sec" style="gap:20px">' + backBtn('Benessere', {screen:'well'}) + '<div class="intro"><span class="label">Benessere · con suoni</span><h2>Respirazione guidata</h2></div>' +
      '<div class="sec" style="gap:8px"><span class="label">Tecnica</span><div class="seg">' + Object.entries(BREATH).map(([k, b]) => '<button data-tech="' + k + '" aria-pressed="' + (tech === k) + '">' + b.name + '</button>').join('') + '</div><p class="small muted">' + BREATH[tech].desc + '</p></div>' +
      '<div class="sec" style="gap:8px"><span class="label">Durata</span><div class="seg">' + [2, 5, 10].map(m => '<button data-m="' + m + '" aria-pressed="' + (mins === m) + '">' + m + ' min</button>').join('') + '</div></div>' +
      '<div class="bstage"><div class="bcirc" id="bc"><span id="bt">Pronto</span></div></div><p class="small muted" id="brem" style="text-align:center;min-height:1.5em"></p>' +
      '<div class="row center"><button class="btn" id="bgo">Inizia</button></div>' +
      '<div class="row center"><button class="textlink" id="snd" style="align-self:center">' + (S.sound ? 'Suono attivo · disattiva' : 'Suono spento · attiva') + '</button></div>' +
      '<p class="small muted" style="text-align:center">Usa le cuffie se puoi. Se senti capogiri, torna a respirare normalmente.</p></div>';
    view.querySelectorAll('[data-tech]').forEach(b => b.onclick = () => { if (!breathRun) { tech = b.dataset.tech; draw(); } });
    view.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { if (!breathRun) { mins = +b.dataset.m; draw(); } });
    view.querySelector('#bgo').onclick = () => { if (breathRun) { stopBreath(); draw(); } else run(); };
    view.querySelector('#snd').onclick = () => { S.sound = !S.sound; save(); stopBreath(); draw(); };
  };
  const run = () => {
    ac(); Ambient.start();
    const B = BREATH[tech], cycle = B.ph.reduce((t, p) => t + p[1], 0), cycles = Math.max(1, Math.round(mins * 60 / cycle)), end = Date.now() + cycles * cycle * 1000;
    let i = 0; view.querySelector('#bgo').textContent = 'Ferma'; view.querySelectorAll('.seg button').forEach(b => b.disabled = true);
    const bc = document.getElementById('bc'), bt = document.getElementById('bt'), brem = document.getElementById('brem'), reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    breathRun = {}; breathRun.iv = setInterval(() => { const s = Math.max(0, Math.round((end - Date.now()) / 1000)); brem.textContent = 'Mancano ' + Math.floor(s / 60) + ':' + pad(s % 60); }, 500);
    const phase = () => {
      if (!breathRun) return;
      if (i >= cycles * B.ph.length) {
        stopBreath(); bell(392, 0, .28, 3.5); bell(523.25, .5, .28, 4);
        bt.innerHTML = 'Fatto'; bc.classList.remove('grow'); brem.textContent = mins + ' minuti di respiro';
        const W = S.well[today()] = S.well[today()] || {}; W.breath = true; save(); toast('Respirazione completata');
        view.querySelector('#bgo').textContent = 'Ricomincia'; view.querySelector('#bgo').onclick = () => draw(); view.querySelectorAll('.seg button').forEach(b => b.disabled = false);
        return;
      }
      const [label, secs, kind] = B.ph[i % B.ph.length];
      bc.style.transitionDuration = secs + 's';
      if (!reduce) { if (kind === 'in') bc.classList.add('grow'); if (kind === 'out') bc.classList.remove('grow'); }
      Ambient.phase(kind, secs); if (i % B.ph.length === 0) bell(330, 0, .06, 1.6);
      let left = secs; bt.innerHTML = label + '<small>' + left + '</small>';
      const tick = () => { left--; if (left > 0 && breathRun) { bt.innerHTML = label + '<small>' + left + '</small>'; breathRun.t = setTimeout(tick, 1000); } else { i++; phase(); } };
      breathRun.t = setTimeout(tick, 1000);
    };
    phase();
  };
  draw();
}

render();
if (lockDue()) showLock(); else lockSeen();
setTimeout(samsungPop, 300);
</script>
