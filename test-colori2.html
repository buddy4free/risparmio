<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark only"><title>Prova colori 2</title>
<style>:root{color-scheme:dark}body{background:#000;color:#fff;font:16px system-ui,sans-serif;margin:0;padding:16px}h1{font-size:1.2rem}
.r{display:flex;align-items:center;gap:12px;margin:10px 0}.n{font:700 1.6rem system-ui;width:34px}.w{display:flex;gap:8px;flex:1}
.s{flex:1;height:64px;border-radius:12px}.y{background:#FFC90A}.g{background:#22A45D}.b{background:#3987e5}.t{font-size:.85rem;color:#ccc}
.ref{margin-top:16px;padding:12px;border:1px solid #333;border-radius:12px;font-size:.85rem;color:#bbb}</style></head><body>
<h1>Prova colori 2</h1><p>Quale riga (1-5) ha il giallo più simile al logo Buddy4Free, senza sembrare "slavata"?</p>
<div class="r"><span class="n">1</span><div class="w"><i class="s y"></i><i class="s g"></i><i class="s b"></i></div></div>
<div class="r" style="filter:brightness(1.25)"><span class="n">2</span><div class="w"><i class="s y"></i><i class="s g"></i><i class="s b"></i></div></div>
<div class="r" style="filter:brightness(1.5)"><span class="n">3</span><div class="w"><i class="s y"></i><i class="s g"></i><i class="s b"></i></div></div>
<div class="r" style="filter:brightness(1.8)"><span class="n">4</span><div class="w"><i class="s y"></i><i class="s g"></i><i class="s b"></i></div></div>
<div class="r" style="filter:brightness(1.4) saturate(1.3)"><span class="n">5</span><div class="w"><i class="s y"></i><i class="s g"></i><i class="s b"></i></div></div>
<div class="ref" id="i"></div>
<script>document.getElementById('i').textContent='Tema scuro: '+(matchMedia('(prefers-color-scheme: dark)').matches?'sì':'no')+' · inverted: '+(matchMedia('(inverted-colors: inverted)').matches?'sì':'no')+' · '+navigator.userAgent;</script>
</body></html>
